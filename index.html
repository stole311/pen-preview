<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kugelschreiber-Vorschau</title>
<style>
  .pp { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 820px; margin: 0 auto; padding: 16px; color: #222; }
  .pp * { box-sizing: border-box; }
  .pp h2 { margin: 0 0 4px; font-size: 1.3rem; }
  .pp p.hint { margin: 0 0 12px; color: #666; font-size: .9rem; }
  .pp .stage { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  .pp canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
  .pp canvas.drag { cursor: grabbing; }
  .pp .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
  .pp label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: #444; }
  .pp input[type=range], .pp select { width: 100%; }
  .pp .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .pp button, .pp .file { font: inherit; padding: 9px 14px; border-radius: 6px; border: 1px solid #b8864b; background: #b8864b; color: #fff; cursor: pointer; }
  .pp button.secondary { background: #fff; color: #8a5f2c; }
  .pp .file input { display: none; }
  .pp .note { font-size: .8rem; color: #777; margin-top: 10px; }
</style>
</head>
<body>
<div class="pp" id="pen-preview">
  <h2>So sieht Ihr Kugelschreiber aus</h2>
  <p class="hint">Logo hochladen (PNG, JPG, SVG), mit Maus oder Finger verschieben und Größe anpassen.</p>

  <div class="stage"><canvas id="pp-canvas" width="800" height="739"></canvas></div>

  <div class="row">
    <label class="file">Logo auswählen<input type="file" id="pp-file" accept="image/png,image/jpeg,image/svg+xml,image/webp"></label>
    <button class="secondary" id="pp-reset" type="button">Zurücksetzen</button>
    <button class="secondary" id="pp-download" type="button">Vorschau speichern</button>
  </div>

  <div class="controls">
    <label>Größe <input type="range" id="pp-size" min="20" max="400" value="150"></label>
    <label>Drehung <input type="range" id="pp-rot" min="-180" max="180" value="0"></label>
    <label>Darstellung
      <select id="pp-mode">
        <option value="multiply">Aufdruck (dunkle Logos)</option>
        <option value="source-over">Deckend (helle Logos)</option>
      </select>
    </label>
  </div>
  <p class="note">Unverbindliche Visualisierung. Das fertige Produkt kann in Farbe und Position leicht abweichen. Das Logo wird nur in Ihrem Browser verarbeitet und nicht hochgeladen.</p>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const canvas = $('pp-canvas'), ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Stiftachse (Pixel im Bild): Spitze -> Ende
  const AX = { x0: 15, y0: 720, x1: 760, y1: 50 };
  const len = Math.hypot(AX.x1 - AX.x0, AX.y1 - AX.y0);
  const dx = (AX.x1 - AX.x0) / len, dy = (AX.y1 - AX.y0) / len;
  const axisAngle = Math.atan2(dy, dx);
  // Bedruckbarer Bereich entlang der Achse (Holzschaft zwischen Metallspitze und Clip)
  const U_MIN = 165, U_MAX = 650;

  const state = { x: 300, y: 455, size: 150, rot: 0, alpha: 0.9, mode: 'multiply', logo: null };
  const def = Object.assign({}, state);

  const pen = new Image();
  let mask = null;

  function makeDemoLogo() {
    const c = document.createElement('canvas'); c.width = 400; c.height = 140;
    const g = c.getContext('2d');
    g.fillStyle = '#1b4f9c'; g.font = 'bold 72px Arial'; g.textBaseline = 'middle';
    g.fillText('IHR LOGO', 8, 62);
    g.fillRect(8, 112, 384, 8);
    const i = new Image(); i.src = c.toDataURL(); return i;
  }

  function buildMask() {
    const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
    const g = tmp.getContext('2d'); g.drawImage(pen, 0, 0, W, H);
    const d = g.getImageData(0, 0, W, H), p = d.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const r = p[i], b = p[i + 2];
      const u = (x - AX.x0) * dx + (y - AX.y0) * dy;
      const wood = (r - b) > 35 && r > 110 && u > U_MIN && u < U_MAX;
      p[i] = p[i + 1] = p[i + 2] = 0; p[i + 3] = wood ? 255 : 0;
    }
    g.putImageData(d, 0, 0);
    // Kanten leicht weichzeichnen und einziehen
    const m = document.createElement('canvas'); m.width = W; m.height = H;
    const mg = m.getContext('2d'); mg.filter = 'blur(1.5px)'; mg.drawImage(tmp, 0, 0);
    mask = m;
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(pen, 0, 0, W, H);
    if (!state.logo || !mask) return;
    const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
    const g = layer.getContext('2d');
    const lw = state.size, lh = state.size * state.logo.naturalHeight / state.logo.naturalWidth;
    g.translate(state.x, state.y);
    g.rotate(axisAngle + state.rot * Math.PI / 180);
    g.drawImage(state.logo, -lw / 2, -lh / 2, lw, lh);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'destination-in';
    g.drawImage(mask, 0, 0);
    ctx.save();
    ctx.globalAlpha = state.alpha;
    ctx.globalCompositeOperation = state.mode;
    ctx.drawImage(layer, 0, 0);
    ctx.restore();
  }

  function setLogo(src) {
    const img = new Image();
    img.onload = () => {
      if (!img.naturalWidth) return;
      state.logo = img; render();
    };
    img.src = src;
  }

  // Eingaben
  $('pp-file').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { state.logo = img; render(); };
    img.onerror = () => alert('Diese Datei konnte nicht gelesen werden. Bitte PNG, JPG oder SVG verwenden.');
    img.src = url;
  });
  $('pp-size').addEventListener('input', e => { state.size = +e.target.value; render(); });
  $('pp-rot').addEventListener('input', e => { state.rot = +e.target.value; render(); });
  $('pp-mode').addEventListener('change', e => { state.mode = e.target.value; render(); });
  $('pp-reset').addEventListener('click', () => {
    Object.assign(state, def, { logo: state.logo });
    $('pp-size').value = def.size; $('pp-rot').value = 0; $('pp-mode').value = def.mode;
    render();
  });
  $('pp-download').addEventListener('click', () => {
    const a = document.createElement('a'); a.download = 'kugelschreiber-vorschau.png';
    a.href = canvas.toDataURL('image/png'); a.click();
  });

  // Verschieben per Maus/Touch
  let drag = null;
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  canvas.addEventListener('pointerdown', e => {
    const p = pos(e); drag = { dx: state.x - p.x, dy: state.y - p.y };
    canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag');
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return; const p = pos(e);
    state.x = p.x + drag.dx; state.y = p.y + drag.dy; render();
  });
  const end = () => { drag = null; canvas.classList.remove('drag'); };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  pen.onload = () => { buildMask(); state.logo = makeDemoLogo(); state.logo.onload = render; render(); };
  pen.src = 'pen.png';
})();
</script>
</body>
</html>
